<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<title>Ritmo do Ícaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita de app, com navegação fixa embaixo; o polegar faz tudo. */
:root{
  --bg:#EDF0EA; --sup:#F9FAF6; --sup2:#E2E7DF; --linha:#CBD3C8;
  --fg:#18231E; --fg2:#4C5A52; --fg3:#6C7A71;
  --acc:#0E6B59; --acc-fg:#F4FBF8; --min:#B4730C; --min-fg:#FFF9EE; --ruim:#A63D2F; --vazio:#DDE3DA;
  --disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --txt:"Figtree","Avenir Next",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111815; --sup:#19221E; --sup2:#222D28; --linha:#34423B;
  --fg:#E6EDE8; --fg2:#AEBBB3; --fg3:#8A988F;
  --acc:#4CC4A3; --acc-fg:#07241C; --min:#E5AE45; --min-fg:#2B1E05; --ruim:#EE8A7A; --vazio:#27332D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --sup:#19221E; --sup2:#222D28; --linha:#34423B;
  --fg:#E6EDE8; --fg2:#AEBBB3; --fg3:#8A988F;
  --acc:#4CC4A3; --acc-fg:#07241C; --min:#E5AE45; --min-fg:#2B1E05; --ruim:#EE8A7A; --vazio:#27332D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--txt);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{width:100%;min-width:0;background:var(--sup);border:1px solid var(--linha);border-radius:8px;padding:11px 12px;font-size:16px}
textarea{resize:vertical;min-height:72px;display:block}
input::placeholder,textarea::placeholder{color:var(--fg3)}
h1,h2{font-family:var(--disp);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:27px;line-height:1.1;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.2}
p{margin:0}
.secao{display:flex;flex-direction:column;gap:12px}
.rot{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3)}
.aux{font-size:14px;color:var(--fg2)}
.num{font-variant-numeric:tabular-nums}
.topo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.topo>div{min-width:0}
.nav-dia{display:flex;gap:4px;flex:none}
.nav-dia button{width:44px;height:44px;border-radius:8px;background:var(--sup2);font-size:20px}
.nav-dia button:disabled{opacity:.35;cursor:default}
#st{min-height:18px;font-size:12px;color:var(--fg3)}
.aviso{background:var(--sup2);border-radius:8px;padding:11px 13px;font-size:14px;color:var(--fg2)}
.placar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.placar b{font:700 54px/.95 var(--disp);font-variant-numeric:tabular-nums;display:block}
.placar .dir{text-align:right;min-width:0}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dia{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 8px;border-radius:8px;font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.dia.sel{background:var(--sup);box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--fg)}
.dia:disabled{opacity:.45;cursor:default}
.dia i{display:block;width:70%;height:6px;border-radius:3px;background:var(--vazio);overflow:hidden}
.dia i u{display:block;height:100%;background:var(--acc)}
.dia i u.b{background:var(--min)}
.hab{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-top:1px solid var(--linha)}
.hab:first-of-type{border-top:0;padding-top:2px}
.hab strong{font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.op{display:flex;flex-direction:column;gap:1px;text-align:left;min-height:62px;padding:8px 10px;border-radius:8px;background:var(--sup);box-shadow:inset 0 0 0 1px var(--linha);font-size:14px;line-height:1.25;color:var(--fg2)}
.op span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3)}
.op.m{background:var(--min);color:var(--min-fg);box-shadow:none}
.op.c{background:var(--acc);color:var(--acc-fg);box-shadow:none}
.op.m span,.op.c span{color:inherit}
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.escala button{height:46px;border-radius:8px;background:var(--sup);box-shadow:inset 0 0 0 1px var(--linha);font-weight:600;font-variant-numeric:tabular-nums}
.escala button.on{background:var(--acc);color:var(--acc-fg);box-shadow:none}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:14px;font-weight:600}
.btn{min-height:44px;padding:9px 14px;border-radius:8px;background:var(--acc);color:var(--acc-fg);font-weight:600}
.btn.seg{background:var(--sup2);color:var(--fg)}
.btn.mini{min-height:40px;padding:6px 11px;font-size:14px}
.lin{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.lin input{flex:1 1 160px}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.abas button{height:44px;border-radius:8px;background:var(--sup2);font-weight:600}
.abas button.on{background:var(--fg);color:var(--bg)}
.ex{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--linha)}
.ex>div{min-width:0}
.ex input{text-align:right;padding:9px 10px}
.frente{display:flex;flex-direction:column;gap:9px;padding:13px;background:var(--sup);border-radius:10px}
.frente header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.frente header strong{min-width:0;overflow-wrap:anywhere}
.lista{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:5px}
.mapa{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.mapa button{aspect-ratio:1;border-radius:3px;background:var(--vazio);padding:0;max-width:100%}
.mapa button.l1{background:color-mix(in srgb,var(--acc) 30%,var(--vazio))}
.mapa button.l2{background:color-mix(in srgb,var(--acc) 55%,var(--vazio))}
.mapa button.l3{background:color-mix(in srgb,var(--acc) 78%,var(--vazio))}
.mapa button.l4{background:var(--acc)}
.mapa button.fut{visibility:hidden}
.esc{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--fg3)}
.esc i{width:12px;height:12px;border-radius:3px;background:var(--vazio)}
.barra{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:3px 10px;font-size:14px}
.barra em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg2)}
.barra i{grid-column:1/-1;height:7px;border-radius:4px;background:var(--vazio);overflow:hidden;display:block}
.barra i u{display:block;height:100%;background:var(--acc);border-radius:4px}
.barras{display:flex;flex-direction:column;gap:11px}
.lc svg{display:block;width:100%;height:auto;touch-action:pan-y}
.lc text{fill:var(--fg3);font:11px var(--txt)}
.lc .rd{font-size:13px;color:var(--fg2);min-height:19px;font-variant-numeric:tabular-nums}
.colunas{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:112px}
.colunas div{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%;text-align:center;font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums;min-width:0}
.colunas i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.resumo div{min-width:0}
.resumo b{display:block;font:700 28px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{width:38px;height:38px;border-radius:7px;background:var(--sup2);font-size:13px;font-weight:600}
.chips button.on{background:var(--acc);color:var(--acc-fg)}
.edit{display:flex;flex-direction:column;gap:7px;padding:12px;background:var(--sup);border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sup);border-top:1px solid var(--linha);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
nav button{height:46px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg2)}
nav button.on{background:var(--sup2);color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.op,.escala button,.dia i u{transition:background-color .12s}}
</style>
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div id="app"><p class="aux">Carregando seu ritmo…</p></div>
<nav aria-label="Seções"><div id="nav"></div></nav>

<script>
/* Plano inicial. Depois de salvo, vale o que está no banco (config/geral). */
const PADRAO=/*CFG*/{
  metaPeso:null,
  habitos:[
    {id:"treino",pilar:"Corpo",nome:"Treinar",full:"Treino do dia",min:"10 min de flexão e alongamento",dias:[1,3,6]},
    {id:"comer",pilar:"Corpo",nome:"Comer para ganhar peso",full:"5 refeições com proteína",min:"3 refeições de verdade",dias:[0,1,2,3,4,5,6]},
    {id:"dormir",pilar:"Corpo",nome:"Dormir bem",full:"7 horas ou mais",min:"Deitar sem o celular",dias:[0,1,2,3,4,5,6]},
    {id:"estudar",pilar:"Mente",nome:"Estudar",full:"30 minutos",min:"10 minutos",dias:[1,2,3,4,5,6]},
    {id:"projeto",pilar:"Foco",nome:"Avançar em um projeto",full:"Bloco de 45 minutos",min:"15 min na próxima ação",dias:[1,2,3,4,5,6]},
    {id:"alma",pilar:"Alma",nome:"Momento para a alma",full:"10 min de silêncio, oração ou meditação",min:"2 min respirando e agradecendo",dias:[0,1,2,3,4,5,6]}
  ],
  treinos:{
    A:["Agachamento com halter | 3x10","Supino com halteres | 3x10","Remada baixa | 3x10","Elevação pélvica | 3x12","Prancha | 3x30s"],
    B:["Leg press | 3x12","Puxada alta | 3x10","Desenvolvimento com halteres | 3x10","Mesa flexora | 3x12","Rosca direta | 3x12"]
  },
  frentes:[]
}/*FIM*/;

const PILARES=["Corpo","Mente","Foco","Alma"];
const SEM=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const LETRA=["D","S","T","Q","Q","S","S"];
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const ABAS=[["hoje","Hoje"],["corpo","Corpo"],["foco","Foco"],["evolucao","Evolução"],["ajustes","Ajustes"]];

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)};
const soma=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const hoje=()=>iso(new Date());
const segunda=s=>soma(s,-((parse(s).getDay()+6)%7));
const curta=s=>s.slice(8)+"/"+s.slice(5,7);
const ndia=s=>Math.round(parse(s).getTime()/864e5);
const hm=m=>m<60?m+" min":Math.floor(m/60)+"h"+(m%60?pad(m%60):"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

const S={cfg:clone(PADRAO),dias:{},semanas:{},aba:"hoje",data:hoje(),sel:null,confirma:null,cap:"",modo:"carregando",treino:null};
if(ABAS.some(a=>a[0]===location.hash.slice(1)))S.aba=location.hash.slice(1);

/* ---------- Salvamento ---------- */
let db=null;const fila={};
const LOCAL="ritmo-v1";
function lerLocal(){try{return JSON.parse(localStorage.getItem(LOCAL))||{}}catch{return{}}}
function gravarLocal(p,o){const t=lerLocal();t[p]=o;try{localStorage.setItem(LOCAL,JSON.stringify(t))}catch{}}
function status(t){const e=document.getElementById("st");if(e)e.textContent=t}
function salvar(p,o){
  const q=fila[p]||(fila[p]={});q.obj=o;q.sujo=true;status("Salvando…");
  clearTimeout(q.t);q.t=setTimeout(()=>flush(p),500);
}
async function escrever(p,o,tentou){
  try{if(db)await db.doc(p).set(clone(o));else gravarLocal(p,clone(o));status(db?"Salvo":"Salvo neste aparelho")}
  catch(e){
    if(e&&e.code==="unavailable"&&!tentou){await new Promise(r=>setTimeout(r,1500+Math.random()*1000));return escrever(p,o,true)}
    status("Não salvou. Confira a internet e toque de novo.");
  }
}
async function flush(p){
  const q=fila[p];if(!q||q.voando)return;
  clearTimeout(q.t);q.voando=true;q.sujo=false;
  await escrever(p,q.obj);
  q.voando=false;
  if(q.sujo)flush(p);else delete fila[p];
}
const dia=(d=S.data)=>S.dias[d]||(S.dias[d]={});
const salvaDia=(d=S.data)=>salvar("dias/"+d,S.dias[d]);
const salvaCfg=()=>salvar("config/geral",S.cfg);

/* ---------- Contas do ritmo ---------- */
const devidos=d=>{const w=parse(d).getDay();return S.cfg.habitos.filter(h=>h.dias.includes(w))};
function pct(d){
  const hs=devidos(d);if(!hs.length)return null;
  const r=S.dias[d]?.h||{};
  return hs.reduce((t,h)=>t+(r[h.id]===2?1:r[h.id]===1?.5:0),0)/hs.length;
}
const valido=d=>(pct(d)??0)>=.5;
/* Só quebra a sequência com duas falhas seguidas. Hoje ainda não conta como falha. */
function sequencia(){
  let n=0,falhas=0,d=hoje(),primeiro=true;
  for(let i=0;i<1500;i++){
    if(valido(d)){n++;falhas=0}
    else if(!primeiro){falhas++;if(falhas>=2)break}
    primeiro=false;d=soma(d,-1);
  }
  return n;
}
function media(ini,fim){
  let t=0,n=0;
  for(let d=ini;d<=fim&&d<=hoje();d=soma(d,1)){const p=pct(d);if(p!==null){t+=p;n++}}
  return n?t/n:null;
}
const fmtPct=p=>p===null?"sem dados":Math.round(p*100)+"%";
function selo(p){return p===null?"Dia livre":p>=.85?"Dia cheio":p>=.5?"Dia salvo":p>0?"Começou":"Em aberto"}
function minutos(id,ini,fim){let t=0;for(let d=ini;d<=fim;d=soma(d,1))t+=S.dias[d]?.min?.[id]||0;return t}
function pesos(){return Object.keys(S.dias).filter(d=>S.dias[d].peso).sort().map(d=>({d,v:S.dias[d].peso}))}
function proximoTreino(h){
  for(let i=1;i<8;i++){const d=soma(S.data,i);if(h.dias.includes(parse(d).getDay()))return SEM[parse(d).getDay()].toLowerCase()}
  return "sem dia marcado";
}

/* ---------- Gráficos ---------- */
function linha({id,pts,ini,fim,min,max,ticks,fmt,meta,vazio}){
  if(!pts.length)return `<p class="aux">${esc(vazio)}</p>`;
  const W=340,H=130,L=34,R=10,T=10,B=20,a=ndia(ini),b=ndia(fim);
  const X=d=>L+(W-L-R)*(ndia(d)-a)/Math.max(1,b-a);
  const Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  const cs=pts.map(p=>[+X(p.d).toFixed(1),+Y(p.v).toFixed(1)]);
  const trilha=cs.map((c,i)=>(i?"L":"M")+c[0]+" "+c[1]).join("");
  const area=cs.length>1?`<path d="${trilha}L${cs[cs.length-1][0]} ${H-B}L${cs[0][0]} ${H-B}Z" fill="var(--acc)" opacity=".12"/>`:"";
  const ult=pts[pts.length-1];
  const padrao=`Último registro: ${fmt(ult.v)} em ${curta(ult.d)}`;
  const dados=esc(JSON.stringify(pts.map((p,i)=>({x:cs[i][0],t:curta(p.d)+": "+fmt(p.v)}))));
  return `<div class="lc" data-pts="${dados}" data-padrao="${esc(padrao)}">
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(id)}. ${esc(padrao)}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--linha)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${esc(fmt(t,1))}</text>`).join("")}
    ${meta?`<line x1="${L}" x2="${W-R}" y1="${Y(meta)}" y2="${Y(meta)}" stroke="var(--fg2)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-R}" y="${Y(meta)-4}" text-anchor="end">meta</text>`:""}
    ${area}<path d="${trilha}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${cs[cs.length-1][0]}" cy="${cs[cs.length-1][1]}" r="4" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/>
    <line class="xh" y1="${T}" y2="${H-B}" stroke="var(--fg3)" stroke-width="1" visibility="hidden"/>
    <text x="${L}" y="${H-4}">${curta(ini)}</text><text x="${W-R}" y="${H-4}" text-anchor="end">${curta(fim)}</text>
  </svg><div class="rd">${esc(padrao)}</div></div>`;
}
function ativarGraficos(){
  document.querySelectorAll(".lc").forEach(el=>{
    const pts=JSON.parse(el.dataset.pts),svg=el.querySelector("svg"),xh=el.querySelector(".xh"),rd=el.querySelector(".rd");
    const mover=e=>{
      const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*340;
      const p=pts.reduce((a,b)=>Math.abs(b.x-x)<Math.abs(a.x-x)?b:a);
      xh.setAttribute("x1",p.x);xh.setAttribute("x2",p.x);xh.setAttribute("visibility","visible");rd.textContent=p.t;
    };
    svg.addEventListener("pointermove",mover);svg.addEventListener("pointerdown",mover);
    svg.addEventListener("pointerleave",()=>{xh.setAttribute("visibility","hidden");rd.textContent=el.dataset.padrao});
  });
}

/* ---------- Telas ---------- */
function tHoje(){
  const d=S.data,o=S.dias[d]||{},dt=parse(d),seg=segunda(d),p=pct(d),h=hoje();
  const faixa=[...Array(7)].map((_,i)=>{
    const x=soma(seg,i),q=pct(x)??0;
    return `<button class="dia ${x===d?"sel":""}" data-a="ir" data-v="${x}" ${x>h?"disabled":""} aria-label="${SEM[parse(x).getDay()]}, ${fmtPct(pct(x))}">
      ${LETRA[parse(x).getDay()]}<span>${x.slice(8)}</span><i><u class="${q<.5?"b":""}" style="width:${Math.round(q*100)}%"></u></i></button>`}).join("");
  const ontemFalhou=d===h&&!valido(soma(h,-1))&&Object.keys(S.dias).some(x=>x<h);
  const grupos=PILARES.map(pl=>{
    const hs=S.cfg.habitos.filter(x=>x.pilar===pl);if(!hs.length)return"";
    const w=dt.getDay(),linhas=hs.map(x=>{
      if(!x.dias.includes(w))return `<div class="hab"><strong>${esc(x.nome)}</strong><span class="aux">Descanso hoje. Próximo: ${proximoTreino(x)}.</span></div>`;
      const v=o.h?.[x.id]||0;
      return `<div class="hab"><strong>${esc(x.nome)}</strong><div class="duo">
        <button class="op ${v===1?"m":""}" data-a="hab" data-v="${esc(x.id)}" data-n="1" aria-pressed="${v===1}"><span>Mínimo</span>${esc(x.min)}</button>
        <button class="op ${v===2?"c":""}" data-a="hab" data-v="${esc(x.id)}" data-n="2" aria-pressed="${v===2}"><span>Completo</span>${esc(x.full)}</button>
      </div></div>`}).join("");
    return `<section class="secao"><div class="rot">${pl}</div><div>${linhas}</div></section>`}).join("");
  const nota=(c,t)=>`<div class="campo"><label>${t}</label><div class="escala">${[1,2,3,4,5].map(n=>`<button class="${o[c]===n?"on":""}" data-a="nota" data-c="${c}" data-v="${n}" aria-pressed="${o[c]===n}">${n}</button>`).join("")}</div></div>`;
  return `<header class="topo"><div><div class="rot">${d===h?"Hoje":"Registro de outro dia"}</div><h1>${SEM[dt.getDay()]}, ${dt.getDate()} de ${MES[dt.getMonth()]}</h1><div id="st"></div></div>
    <div class="nav-dia"><button data-a="ir" data-v="${soma(d,-1)}" aria-label="Dia anterior">‹</button><button data-a="ir" data-v="${soma(d,1)}" ${d>=h?"disabled":""} aria-label="Próximo dia">›</button></div></header>
  ${aviso()}
  <section class="secao"><div class="placar"><div><b>${sequencia()}</b><span class="aux">dias no ritmo</span></div><div class="dir"><h2>${selo(p)}</h2><span class="aux num">${fmtPct(p)} do dia</span></div></div><div class="semana">${faixa}</div></section>
  ${ontemFalhou?`<p class="aviso">Ontem ficou para trás, e tudo bem. A regra é nunca falhar dois dias seguidos: hoje, o mínimo já salva.</p>`:""}
  <div class="campo"><label for="prio">A única coisa que faz este dia valer</label><input id="prio" data-dia="prioridade" value="${esc(o.prioridade)}" placeholder="Escreva uma tarefa, não uma lista"></div>
  ${grupos}
  <section class="secao"><div class="rot">Como você está</div>
    ${nota("energia","Disposição, de 1 a 5")}${nota("humor","Cabeça e humor, de 1 a 5")}
    ${dt.getDay()===1?`<div class="campo"><label for="pesoh">Peso de segunda, em kg</label><input id="pesoh" inputmode="decimal" data-dia="peso" value="${o.peso??""}" placeholder="Em jejum, ao acordar"></div>`:""}
    <div class="campo"><label for="obs">Uma linha sobre o dia</label><textarea id="obs" data-dia="obs" placeholder="O que foi bom, o que pesou, pelo que agradece">${esc(o.obs)}</textarea></div>
  </section>`;
}
function aviso(){
  return "";
}
function tCorpo(){
  const o=S.dias[S.data]||{},h=S.cfg.habitos.find(x=>x.id==="treino");
  let ult=null;for(let d=soma(S.data,-1),i=0;i<120;i++,d=soma(d,-1))if(S.dias[d]?.treino){ult=S.dias[d].treino;break}
  const sug=ult==="A"?"B":"A",sel=S.treino||o.treino||sug;
  const carga=n=>{for(let d=soma(S.data,-1),i=0;i<180;i++,d=soma(d,-1)){const c=S.dias[d]?.cargas?.[n];if(c)return{c,d}}return null};
  const ex=(S.cfg.treinos[sel]||[]).map((l,i)=>{
    const[n,s]=l.split("|").map(t=>t.trim()),u=carga(n);
    return `<div class="ex"><div><strong>${esc(n)}</strong><div class="aux num">${esc(s||"")}${u?` · última: ${esc(u.c)} kg em ${curta(u.d)}`:""}</div></div><input id="c${sel}${i}" inputmode="decimal" aria-label="Carga em kg de ${esc(n)}" data-carga="${esc(n)}" value="${esc(o.cargas?.[n])}" placeholder="kg"></div>`}).join("");
  const ps=pesos(),fim=hoje(),ini=soma(fim,-89);
  const vis=ps.filter(p=>p.d>=ini),vals=vis.map(p=>p.v).concat(S.cfg.metaPeso?[S.cfg.metaPeso]:[]);
  const lo=vals.length?Math.floor(Math.min(...vals)-1):0,hi=vals.length?Math.ceil(Math.max(...vals)+1):1;
  let ritmo="";
  if(ps.length>1){const a=ps.find(p=>p.d>=soma(ps[ps.length-1].d,-28))||ps[0],z=ps[ps.length-1],sem=(ndia(z.d)-ndia(a.d))/7;
    if(sem>=1){const r=(z.v-a.v)/sem;ritmo=`<p class="aux">Você está ${r>=0?"ganhando":"perdendo"} ${Math.abs(r).toFixed(2).replace(".",",")} kg por semana. O alvo é entre 0,25 e 0,5 kg.</p>`}}
  return `<header><div class="rot">Corpo</div><h1>Voltar a treinar e ganhar peso</h1><div id="st"></div></header>${aviso()}
  <section class="secao"><div class="topo"><h2>Treino ${sel}</h2><span class="aux num">${curta(S.data)}</span></div>
    <div class="abas">${["A","B"].map(t=>`<button class="${t===sel?"on":""}" data-a="trn" data-v="${t}">Treino ${t}${t===sug?" (próximo)":""}</button>`).join("")}</div>
    <div>${ex}</div>
    <button class="btn" data-a="feito" data-v="${sel}">${o.treino===sel?"Treino registrado":"Marcar treino como feito"}</button>
    <p class="aux">Nas duas primeiras semanas, use carga leve e termine cada série sentindo que faria mais três repetições. Depois suba a carga quando completar todas as séries. Alternar A e B basta.</p>
  </section>
  <section class="secao"><h2>Peso</h2>
    <div class="campo"><label for="peso">Peso de ${curta(S.data)}, em kg</label><input id="peso" inputmode="decimal" data-dia="peso" value="${o.peso??""}" placeholder="Pese uma vez por semana, em jejum"></div>
    ${linha({id:"Peso nos últimos 90 dias",pts:vis,ini,fim,min:lo,max:hi,ticks:[lo,(lo+hi)/2,hi],fmt:(v,t)=>t?String(+v.toFixed(1)).replace(".",","):String(v).replace(".",",")+" kg",meta:S.cfg.metaPeso,vazio:"Registre o primeiro peso e a linha começa aqui."})}
    ${ritmo}
  </section>
  <section class="secao"><h2>Como comer para engordar com saúde</h2>
    <ol class="lista"><li>Café da manhã: ovos, pão ou cuscuz, fruta.</li><li>Lanche: vitamina de leite, banana, aveia e pasta de amendoim.</li><li>Almoço: arroz, feijão, carne ou frango, salada e um fio de azeite.</li><li>Lanche: sanduíche, iogurte ou castanhas.</li><li>Jantar: igual ao almoço, em porção um pouco menor.</li></ol>
    <p class="aux">A conta é simples: comer cerca de 300 a 500 kcal acima do que você gasta. Se o peso ficar parado por duas semanas, acrescente mais uma vitamina no dia.</p>
  </section>`;
}
function tFoco(){
  const seg=segunda(hoje()),h=hoje(),fs=S.cfg.frentes.filter(f=>!f.fim);
  const bloco=(tipo,titulo,ph)=>{
    const l=fs.filter(f=>f.tipo===tipo);
    return `<section class="secao"><div class="topo"><h2>${titulo}</h2><span class="aux num">${l.length} de 3</span></div>
    ${l.length?l.map(f=>{
      const q=minutos(f.id,seg,h),t=minutos(f.id,h,h);
      return `<div class="frente"><header><strong>${esc(f.nome)}</strong><span class="aux num">${hm(t)} hoje · ${hm(q)} na semana</span></header>
      <div class="campo"><label for="p${esc(f.id)}">Próxima ação</label><input id="p${esc(f.id)}" data-prox="${esc(f.id)}" value="${esc(f.prox)}" placeholder="O próximo passo pequeno e concreto"></div>
      <div class="lin">${[15,30,60].map(m=>`<button class="btn seg mini" data-a="min" data-v="${esc(f.id)}" data-n="${m}">+${m} min</button>`).join("")}<button class="btn seg mini" data-a="min" data-v="${esc(f.id)}" data-n="-15" aria-label="Tirar 15 minutos">−15</button><button class="btn seg mini" data-a="fim" data-v="${esc(f.id)}">${S.confirma===f.id?"Confirmar conclusão":"Concluir"}</button></div></div>`}).join(""):`<p class="aux">Nada aqui ainda. Adicione abaixo.</p>`}
    ${l.length<3?`<div class="lin"><input id="n${tipo}" placeholder="${ph}" aria-label="Novo item"><button class="btn mini" data-a="add" data-v="${tipo}">Adicionar</button></div>`:`<p class="aux">Limite de 3. Conclua um antes de abrir outro: é assim que as coisas terminam.</p>`}</section>`};
  const prontos=S.cfg.frentes.filter(f=>f.fim);
  return `<header><div class="rot">Foco</div><h1>Pouca coisa, até terminar</h1><div id="st"></div></header>${aviso()}
  ${bloco("projeto","Projetos","Nome do projeto")}${bloco("estudo","Estudos","Curso, livro ou assunto")}
  ${prontos.length?`<section class="secao"><h2>Concluídos</h2><ul class="lista">${prontos.map(f=>`<li>${esc(f.nome)} <span class="aux num">em ${curta(f.fim)}</span></li>`).join("")}</ul></section>`:""}`;
}
function tEvolucao(){
  const h=hoje(),seg=segunda(h),ini=soma(seg,-84);
  const cels=[...Array(91)].map((_,i)=>{
    const d=soma(ini,i),p=pct(d)??0,l=!p?0:p<.5?1:p<.7?2:p<.85?3:4;
    return `<button class="l${l} ${d>h?"fut":""}" data-a="cel" data-v="${d}" aria-label="${curta(d)}: ${fmtPct(pct(d))}"></button>`}).join("");
  const ini30=soma(h,-29);
  const bar=S.cfg.habitos.map(x=>{
    let n=0,t=0;for(let d=ini30;d<=h;d=soma(d,1))if(x.dias.includes(parse(d).getDay())){t++;if(S.dias[d]?.h?.[x.id])n++}
    const q=t?n/t:0;return `<div class="barra"><span>${esc(x.nome)}</span><em>${Math.round(q*100)}%</em><i><u style="width:${q*100}%"></u></i></div>`}).join("");
  let val=0;for(let d=ini30;d<=h;d=soma(d,1))if(valido(d))val++;
  const serie=c=>Object.keys(S.dias).filter(d=>d>=ini30&&S.dias[d][c]).sort().map(d=>({d,v:S.dias[d][c]}));
  const sem=[...Array(8)].map((_,i)=>{const a=soma(seg,(i-7)*7),z=soma(a,6);return{a,m:S.cfg.frentes.reduce((t,f)=>t+minutos(f.id,a,z),0)}});
  const mx=Math.max(...sem.map(s=>s.m),60);
  const colunas=sem.map(s=>`<div title="Semana de ${curta(s.a)}: ${hm(s.m)}"><span>${s.m?(s.m/60).toFixed(1).replace(".",","):""}</span><i style="height:${Math.round(s.m/mx*72)}px"></i><span>${curta(s.a)}</span></div>`).join("");
  const r=S.semanas[seg]||{};
  const pr=(c,t,ph)=>`<div class="campo"><label for="r${c}">${t}</label><textarea id="r${c}" data-sem="${c}" placeholder="${ph}">${esc(r[c])}</textarea></div>`;
  const opts={ini:ini30,fim:h,min:1,max:5,ticks:[1,3,5],fmt:(v,t)=>t?String(v):v+" de 5"};
  return `<header><div class="rot">Evolução</div><h1>O que os dias estão mostrando</h1><div id="st"></div></header>${aviso()}
  <section class="resumo"><div><b>${fmtPct(media(seg,h))}</b><span class="aux">esta semana</span></div><div><b>${fmtPct(media(soma(seg,-7),soma(seg,-1)))}</b><span class="aux">semana passada</span></div><div><b>${val}/30</b><span class="aux">dias no ritmo</span></div></section>
  <section class="secao"><h2>Últimas 13 semanas</h2><div class="mapa">${cels}</div>
    <div class="topo"><span class="aux" id="cap">${esc(S.cap||"Toque em um dia para ver.")}</span><span class="esc">menos <i></i><i style="background:color-mix(in srgb,var(--acc) 55%,var(--vazio))"></i><i style="background:var(--acc)"></i> mais</span></div></section>
  <section class="secao"><h2>Hábitos nos últimos 30 dias</h2><div class="barras">${bar}</div><p class="aux">Mínimo e completo contam igual aqui. O que importa é aparecer.</p></section>
  <section class="secao"><h2>Disposição</h2>${linha({...opts,id:"Disposição nos últimos 30 dias",pts:serie("energia"),vazio:"Marque sua disposição na tela Hoje e a linha aparece aqui."})}</section>
  <section class="secao"><h2>Cabeça e humor</h2>${linha({...opts,id:"Humor nos últimos 30 dias",pts:serie("humor"),vazio:"Marque seu humor na tela Hoje e a linha aparece aqui."})}</section>
  <section class="secao"><h2>Horas de foco por semana</h2><div class="colunas">${colunas}</div><p class="aux">Soma de projetos e estudos, registrada na tela Foco.</p></section>
  <section class="secao"><h2>Revisão da semana</h2><p class="aux">Dez minutos no domingo. Semana de ${curta(seg)}.</p>
    ${pr("funcionou","O que funcionou?","O que repetir")}${pr("travou","O que travou?","O que atrapalhou e por quê")}${pr("foco","Qual é o foco da próxima semana?","Uma coisa só")}</section>`;
}
function tAjustes(){
  const c=S.cfg;
  const hs=c.habitos.map((x,i)=>`<div class="edit">
    <div class="campo"><label for="hn${i}">Hábito (${esc(x.pilar)})</label><input id="hn${i}" data-h="${i}" data-c="nome" value="${esc(x.nome)}"></div>
    <div class="campo"><label for="hf${i}">Completo</label><input id="hf${i}" data-h="${i}" data-c="full" value="${esc(x.full)}"></div>
    <div class="campo"><label for="hm${i}">Mínimo</label><input id="hm${i}" data-h="${i}" data-c="min" value="${esc(x.min)}"></div>
    <div class="chips">${[1,2,3,4,5,6,0].map(w=>`<button class="${x.dias.includes(w)?"on":""}" data-a="hd" data-v="${i}" data-n="${w}" aria-pressed="${x.dias.includes(w)}" aria-label="${SEM[w]}">${LETRA[w]}</button>`).join("")}</div>
    <button class="btn seg mini" data-a="hr" data-v="${esc(x.id)}">${S.confirma===x.id?"Confirmar remoção":"Remover hábito"}</button></div>`).join("");
  return `<header><div class="rot">Ajustes</div><h1>Do seu jeito</h1><div id="st"></div></header>${aviso()}
  <section class="secao"><h2>Ter sempre à mão</h2>
    <p class="aux">No iPhone: abra este link no Safari, toque em Compartilhar e depois em Adicionar à Tela de Início. No Android: menu do Chrome, Adicionar à tela inicial. Fica com cara de aplicativo.</p></section>
  <section class="secao"><h2>Seus dados</h2>
    <p class="aux">Tudo fica guardado só neste navegador, neste aparelho. Ninguém mais vê, e limpar os dados do navegador apaga tudo. Baixe uma cópia toda semana. Para passar para outro aparelho, baixe aqui e restaure lá.</p>
    <div class="lin"><button class="btn mini" data-a="baixar">Baixar cópia</button><label class="btn seg mini" for="restaurar" style="display:inline-flex;align-items:center;cursor:pointer">Restaurar cópia</label><input id="restaurar" type="file" accept=".json,application/json" hidden></div></section>
  <section class="secao"><h2>Meta de peso</h2><div class="campo"><label for="meta">Peso que quer alcançar, em kg</label><input id="meta" inputmode="decimal" data-meta="1" value="${c.metaPeso??""}" placeholder="Ex.: 72"></div></section>
  <section class="secao"><h2>Hábitos</h2><p class="aux">Comece com poucos. Um hábito novo só entra quando os atuais estiverem firmes.</p>${hs}
    <div class="lin"><input id="nh" placeholder="Novo hábito" aria-label="Novo hábito"><button class="btn mini" data-a="ha">Adicionar</button></div></section>
  <section class="secao"><h2>Treinos</h2><p class="aux">Um exercício por linha, no formato nome | séries.</p>
    ${["A","B"].map(t=>`<div class="campo"><label for="t${t}">Treino ${t}</label><textarea id="t${t}" rows="6" data-tr="${t}">${esc((c.treinos[t]||[]).join("\n"))}</textarea></div>`).join("")}</section>`;
}
function render(){
  S.data=S.data>hoje()?hoje():S.data;
  document.getElementById("app").innerHTML={hoje:tHoje,corpo:tCorpo,foco:tFoco,evolucao:tEvolucao,ajustes:tAjustes}[S.aba]();
  document.getElementById("nav").innerHTML=ABAS.map(([k,n])=>`<button class="${k===S.aba?"on":""}" data-a="aba" data-v="${k}" ${k===S.aba?'aria-current="page"':""}>${n}</button>`).join("");
  ativarGraficos();
}
const digitando=()=>/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"");

/* ---------- Ações ---------- */
function marcarPorTempo(id,tipo){
  const hid=tipo==="projeto"?"projeto":"estudar";
  if(!S.cfg.habitos.some(h=>h.id===hid))return;
  const[lm,lc]=tipo==="projeto"?[15,45]:[10,30];
  const t=S.cfg.frentes.filter(f=>f.tipo===tipo).reduce((s,f)=>s+(dia().min?.[f.id]||0),0);
  const o=dia();o.h=o.h||{};const v=t>=lc?2:t>=lm?1:0;
  if(v>(o.h[hid]||0))o.h[hid]=v;
}
const COPIA=/^(config\/geral|dias\/\d{4}-\d{2}-\d{2}|semanas\/\d{4}-\d{2}-\d{2})$/;
function restaurar(arq){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const t=JSON.parse(r.result),ps=Object.keys(t).filter(p=>COPIA.test(p));
      if(!ps.length)throw 0;
      ps.forEach(p=>gravarLocal(p,t[p]));modoLocal();status("Cópia restaurada");
    }catch{status("Esse arquivo não é uma cópia do Ritmo.")}
  };
  r.readAsText(arq);
}
const ACOES={
  async baixar(){
    await Promise.all(Object.keys(fila).map(flush));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(lerLocal())],{type:"application/json"}));
    a.download="ritmo-copia-"+hoje()+".json";a.click();URL.revokeObjectURL(a.href);status("Cópia baixada");
  },
  aba(e){S.aba=e.dataset.v;S.confirma=null;S.treino=null;S.data=hoje();location.hash=S.aba;render();scrollTo(0,0)},
  ir(e){if(e.dataset.v<=hoje()){S.data=e.dataset.v;render()}},
  hab(e){const o=dia(),id=e.dataset.v,n=+e.dataset.n;o.h=o.h||{};if(o.h[id]===n)delete o.h[id];else o.h[id]=n;salvaDia();render()},
  nota(e){const o=dia(),c=e.dataset.c,n=+e.dataset.v;if(o[c]===n)delete o[c];else o[c]=n;salvaDia();render()},
  trn(e){S.treino=e.dataset.v;render()},
  feito(e){const o=dia();o.treino=e.dataset.v;if(S.cfg.habitos.some(h=>h.id==="treino")){o.h=o.h||{};o.h.treino=2}salvaDia();render()},
  min(e){const f=S.cfg.frentes.find(x=>x.id===e.dataset.v),S0=S.data;S.data=hoje();const o=dia();o.min=o.min||{};o.min[f.id]=Math.max(0,(o.min[f.id]||0)+ +e.dataset.n);marcarPorTempo(f.id,f.tipo);salvaDia();S.data=S0;render()},
  add(e){const t=e.dataset.v,i=document.getElementById("n"+t),n=i.value.trim();if(!n)return i.focus();S.cfg.frentes.push({id:"f"+Date.now(),tipo:t,nome:n,prox:""});salvaCfg();render()},
  fim(e){const id=e.dataset.v;if(S.confirma!==id){S.confirma=id;return render()}S.cfg.frentes.find(f=>f.id===id).fim=hoje();S.confirma=null;salvaCfg();render()},
  cel(e){const d=e.dataset.v,p=pct(d);S.cap=SEM[parse(d).getDay()]+", "+curta(d)+": "+selo(p).toLowerCase()+(p===null?"":" ("+fmtPct(p)+")");document.getElementById("cap").textContent=S.cap},
  hd(e){const x=S.cfg.habitos[+e.dataset.v],w=+e.dataset.n;x.dias=x.dias.includes(w)?x.dias.filter(q=>q!==w):[...x.dias,w].sort();salvaCfg();render()},
  hr(e){const id=e.dataset.v;if(S.confirma!==id){S.confirma=id;return render()}S.cfg.habitos=S.cfg.habitos.filter(h=>h.id!==id);S.confirma=null;salvaCfg();render()},
  ha(){const i=document.getElementById("nh"),n=i.value.trim();if(!n)return i.focus();S.cfg.habitos.push({id:"h"+Date.now(),pilar:"Mente",nome:n,full:"Completo",min:"Versão de 2 minutos",dias:[0,1,2,3,4,5,6]});salvaCfg();render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)ACOES[b.dataset.a](b)});
const numero=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
document.addEventListener("input",e=>{
  const t=e.target,ds=t.dataset;
  if(t.id==="restaurar"){if(t.files[0])restaurar(t.files[0]);return}
  if(ds.dia){const o=dia();if(ds.dia==="peso"){const n=numero(t.value);if(n===null)delete o.peso;else o.peso=n}else o[ds.dia]=t.value;salvaDia()}
  else if(ds.carga){const o=dia();o.cargas=o.cargas||{};if(t.value.trim())o.cargas[ds.carga]=t.value.trim();else delete o.cargas[ds.carga];salvaDia()}
  else if(ds.sem){const s=segunda(hoje()),r=S.semanas[s]||(S.semanas[s]={});r[ds.sem]=t.value;salvar("semanas/"+s,r)}
  else if(ds.prox){S.cfg.frentes.find(f=>f.id===ds.prox).prox=t.value;salvaCfg()}
  else if(ds.h){S.cfg.habitos[+ds.h][ds.c]=t.value;salvaCfg()}
  else if(ds.meta){S.cfg.metaPeso=numero(t.value);salvaCfg()}
  else if(ds.tr){S.cfg.treinos[ds.tr]=t.value.split("\n").map(l=>l.trim()).filter(Boolean);salvaCfg()}
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)Object.keys(fila).forEach(flush);
  else if(S.ultimo!==hoje()){S.ultimo=hoje();S.data=hoje();if(!digitando())render()}
});
window.addEventListener("hashchange",()=>{const a=location.hash.slice(1);if(a!==S.aba&&ABAS.some(x=>x[0]===a)){S.aba=a;render()}});

/* ---------- Início ---------- */
function modoLocal(){
  S.modo="local";const t=lerLocal();
  for(const[p,o]of Object.entries(t)){const[c,id]=p.split("/");if(c==="config")S.cfg={...S.cfg,...o};if(c==="dias")S.dias[id]=o;if(c==="semanas")S.semanas[id]=o}
  render();
}
S.ultimo=hoje();
modoLocal();
navigator.storage?.persist?.().catch(()=>{});
</script>
</body>
